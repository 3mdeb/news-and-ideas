@startuml
scale 0.9
title AP Boot Chain

skinparam {
    DefaultFontColor #272727
    BackgroundColor #f5f5f5
    ArrowColor #272727
    ParticipantBorderColor #38d430
    ParticipantBackgroundColor #f5f5f5
    LifeLineBorderColor #38d430
    LifeLineBackgroundColor #f5f5f5
    NoteBackgroundColor #f5f5f5
    NoteBorderColor #38d430
    NoteFontColor #272727
    SequenceLifeLineBorderColor #272727
}
skinparam sequence {
    ParticipantPadding 10
    ParticipantBorderThickness 2
    ParticipantFontSize 12
    ParticipantFontStyle bold
}
hide footbox

participant "NAND flash\nstorage" as NAND
participant "Application\nProcessor" as AP

note over AP #FFFACD: Power on
AP -> AP ++#2E7D32: Boot ROM
NAND <- AP: Read iBoot
AP -> AP: Verify iBoot
AP -> AP - -++#38d430: Execute
note right: iBoot
AP -> AP: Update BPR
AP ->]: Assign SE memory
note right: SE inits MPE
AP ->]: Send sepOS
note right #FFFACD: Kernel load\n(parallel)
NAND <- AP: Read kernel
AP -> AP: Verify kernel
AP -> AP - -: Execute kernel

@enduml

