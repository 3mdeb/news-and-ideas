@startuml
scale 1.0
title SE Boot Chain

skinparam {
    DefaultFontColor #272727
    BackgroundColor #f5f5f5
    ArrowColor #272727
    ParticipantBorderColor #2196F3
    ParticipantBackgroundColor #f5f5f5
    LifeLineBorderColor #2196F3
    LifeLineBackgroundColor #f5f5f5
    NoteBackgroundColor #f5f5f5
    NoteBorderColor #2196F3
    NoteFontColor #272727
    SequenceLifeLineBorderColor #272727
}
skinparam sequence {
    ParticipantPadding 10
    ParticipantBorderThickness 2
    ParticipantFontSize 12
    ParticipantFontStyle bold
}
hide footbox

participant "Secure Enclave\nProcessor" as SEP

note over SEP #FFFACD: Power on
SEP -> SEP ++#1565C0: SE Boot ROM
SEP -> SEP: Config SCIP
[-> SEP: Assign SE memory
SEP -> SEP: Init MPE
[-> SEP: Send sepOS
note left #FFFACD: SE verify\n(parallel)
SEP -> SEP: Verify sepOS
SEP -> SEP - -++#2196F3: Execute
note right: sepOS
SEP -> SEP: Lock hash (A10+)

@enduml

